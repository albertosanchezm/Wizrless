#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: aoe_circle_query_2d
    status: active
    api: "PhysicsDirectSpaceState2D.intersect_shape() with PhysicsShapeQueryParameters2D + CircleShape2D"
    not: "PhysicsDirectSpaceState2D.intersect_circle() — method does not exist in any Godot 4.x release"
    adr: docs/architecture/adr-0001-autoload-singleton-architecture.md
    reason: "intersect_circle() is a fabricated method name. intersect_shape() with CircleShape2D is the correct Godot 4.6 API for AoE circle overlap queries. Confirmed by engine specialist 2026-05-10."
    referenced_by:
      - docs/architecture/adr-0001-autoload-singleton-architecture.md
    added: 2026-05-10
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: get_node_autoload_access
    status: active
    description: "Never use get_node('/root/SystemName') to access an autoload singleton per call site. Use the direct global accessor instead: SpellInteractionEngine.process_hit(...) not get_node('/root/SpellInteractionEngine').process_hit(...)."
    why: "The global accessor is synthesized by Godot at parse time — get_node() is redundant, bypasses type safety, and is brittle to autoload renames. No performance benefit."
    adr: docs/architecture/adr-0001-autoload-singleton-architecture.md
    added: 2026-05-10

  - pattern: onready_autoload_cache
    status: active
    description: "Never cache an autoload reference via @onready var x := get_node('/root/SystemName'). The global accessor already exists — caching it is unnecessary and creates a hidden dependency that breaks if the autoload is renamed."
    why: "Autoload names are global constants in Godot 4. Caching them adds boilerplate without benefit and obfuscates the dependency in the class body."
    adr: docs/architecture/adr-0001-autoload-singleton-architecture.md
    added: 2026-05-10

